version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: workshop-organizer-frontend:latest
    container_name: workshop-frontend
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - workshop-network

networks:
  workshop-network:
    driver: bridge
