version: '3.8'

services:
  app:
    image: workshop-organizer:latest
    container_name: workshop-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/workshopsdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/workshops"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - workshop-network
    restart: unless-stopped

  db:
    image: postgres:13
    container_name: workshop-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: workshopsdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workshop-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  workshop-network:
    driver: bridge
