name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            G-rez-l-int-gration-et-la-livraison-continue-Application-Angular/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('G-rez-l-int-gration-et-la-livraison-continue-Application-Angular/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('G-rez-l-int-gration-et-la-livraison-continue-Application-Java/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make test script executable
        run: chmod +x ./scripts/run-tests.sh

      - name: Run tests
        run: ./scripts/run-tests.sh

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/*.xml
          check_name: Test Results
          comment_title: Test Report

  build:
    name: Build and Push Images
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./G-rez-l-int-gration-et-la-livraison-continue-Application-Java
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./G-rez-l-int-gration-et-la-livraison-continue-Application-Angular
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "## Docker Images Built and Pushed 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_BACKEND }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_BACKEND }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_FRONTEND }}:latest" >> $GITHUB_STEP_SUMMARY

  release:
    name: Semantic Release
    needs: build
    runs-on: ubuntu-latest
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install semantic-release
        run: |
          npm install -g semantic-release
          npm install -g @semantic-release/commit-analyzer
          npm install -g @semantic-release/release-notes-generator
          npm install -g @semantic-release/changelog
          npm install -g @semantic-release/github
          npm install -g @semantic-release/git

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          semantic-release
          # Store version for next steps
          VERSION=$(npm list -g semantic-release 2>/dev/null | grep semantic-release | grep -oP '\d+\.\d+\.\d+' || echo "unknown")
          echo "new_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check for new release
        id: check_release
        run: |
          # Check if new version was created
          if git describe --tags --abbrev=0 2>/dev/null | grep -q "^v"; then
            LATEST_TAG=$(git describe --tags --abbrev=0)
            echo "tag_created=true" >> $GITHUB_OUTPUT
            echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
            # Extract version without 'v' prefix
            echo "version=${LATEST_TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "tag_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Retag backend image with version
        if: steps.check_release.outputs.tag_created == 'true'
        run: |
          VERSION=${{ steps.check_release.outputs.version }}
          # Pull, retag, and push
          docker pull ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_BACKEND }}:${{ github.sha }} ${{ env.IMAGE_BACKEND }}:${VERSION}
          docker push ${{ env.IMAGE_BACKEND }}:${VERSION}
          echo "✅ Backend image retagged: ${{ env.IMAGE_BACKEND }}:${VERSION}"

      - name: Retag frontend image with version
        if: steps.check_release.outputs.tag_created == 'true'
        run: |
          VERSION=${{ steps.check_release.outputs.version }}
          # Pull, retag, and push
          docker pull ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} ${{ env.IMAGE_FRONTEND }}:${VERSION}
          docker push ${{ env.IMAGE_FRONTEND }}:${VERSION}
          echo "✅ Frontend image retagged: ${{ env.IMAGE_FRONTEND }}:${VERSION}"

      - name: Release summary
        if: always()
        run: |
          echo "## 🚀 Semantic Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_release.outputs.tag_created }}" = "true" ]; then
            echo "✅ **New Release Created**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Release Version" >> $GITHUB_STEP_SUMMARY
            echo "- Tag: ${{ steps.check_release.outputs.latest_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "- Version: ${{ steps.check_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
            echo "- ${{ env.IMAGE_BACKEND }}:${{ steps.check_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "- ${{ env.IMAGE_FRONTEND }}:${{ steps.check_release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.check_release.outputs.latest_tag }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **No Release Created**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No commits matched the release rules. The code is up to date." >> $GITHUB_STEP_SUMMARY
          fi
